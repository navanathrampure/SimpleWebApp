name: SimpleWebApp CI-CD

on:
  push:
    branches:
      - main

jobs:

  build-and-test:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build application
        run: mvn clean package

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleWebApp-JAR
          path: target/*.jar


		  deploy:
		    needs: build-and-test
		    runs-on: self-hosted

		    steps:
		      - name: Download JAR artifact
		        uses: actions/download-artifact@v4
		        with:
		          name: SimpleWebApp-JAR
		          path: SimpleWebApp-JAR

		      - name: Start application
		        shell: powershell
		        run: |
		          $jar = Get-ChildItem "SimpleWebApp-JAR\*.jar" | Select-Object -First 1
		          Start-Process java -ArgumentList "-jar `"$($jar.FullName)`"" -RedirectStandardOutput "application.log" -RedirectStandardError "application-error.log"
		          Start-Sleep -Seconds 10

		      - name: Smoke test application
		        shell: powershell
		        run: |
		          Invoke-WebRequest -Uri "http://localhost:8080" -UseBasicParsing